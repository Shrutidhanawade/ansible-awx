---
- name: Install Apache Web Server on Ubuntu
  hosts: 18.212.50.197
  become: true
  gather_facts: false

  pre_tasks:
    - name: Update apt cache
      raw: apt-get update -y
      register: apt_update
      changed_when: false

    - name: Install python3-apt
      raw: apt-get install -y python3-apt
      register: install_python3_apt
      changed_when: false

    - name: Install python3-six
      raw: apt-get install -y python3-six
      register: install_python3_six
      changed_when: false

    - name: Install python3-pip
      raw: apt-get install -y python3-pip
      register: install_python3_pip
      changed_when: false

    - name: Re-enable fact gathering
      setup:

  tasks:
    - name: Install Apache
      apt:
        name: apache2
        state: present
        update_cache: yes

    - name: Ensure Apache is started and enabled
      service:
        name: apache2
        state: started
        enabled: yes

    - name: Display Apache status
      command: systemctl status apache2 --no-pager
      register: apache_status
      ignore_errors: true
      changed_when: false

    - name: Show Apache status output
      debug:
        msg: "{{ apache_status.stdout }}"
