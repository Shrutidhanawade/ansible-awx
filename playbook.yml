---
- name: Install and manage Apache on Ubuntu
  hosts: all
  become: true
  gather_facts: false  # Disable gathering facts to avoid python-apt dependency

  pre_tasks:
    - name: Ensure apt cache is updated
      raw: apt-get update -y
      register: update_result
      changed_when: false

    - name: Install python3-six and python3-apt if not present
      raw: apt-get install -y python3-six python3-apt
      register: python3_dependencies_result
      changed_when: "'Setting up python3-six' in python3_dependencies_result.stdout or 'Setting up python3-apt' in python3_dependencies_result.stdout"

    - name: Re-enable fact gathering
      setup:

  tasks:
    - name: Install Apache Web Server
      apt:
        name: apache2
        state: present
        update_cache: yes

    - name: Ensure Apache is started and enabled
      service:
        name: apache2
        state: started
        enabled: yes

    - name: Check Apache status
      command: systemctl status apache2 --no-pager
      register: apache_status
      ignore_errors: yes
      changed_when: false

    - name: Display Apache status
      debug:
        msg: "{{ apache_status.stdout }}"
